<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset="0.55" stop-color="#b85ad9"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#f0a92c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#3b1a63" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" rx="0" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="130" y="118" width="252" height="110" rx="26" fill="#a6ecd0"/>
    <rect x="112" y="148" width="288" height="96" rx="24" fill="#8fe0c0"/>
    <rect x="80" y="186" width="332" height="196" rx="40" fill="#ffffff"/>
    <rect x="300" y="254" width="144" height="70" rx="26" fill="#8b5cf6"/>
    <circle cx="364" cy="289" r="16" fill="#ffffff"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="410" cy="392" r="60" fill="url(#coin)"/>
    <circle cx="410" cy="392" r="48" fill="none" stroke="#e8a21f" stroke-width="5" opacity="0.55"/>
    <text x="410" y="414" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#b8700f">$</text>
  </g>
