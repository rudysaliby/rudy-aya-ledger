# Cloudflare Worker: the API in src/worker.mjs, data in one Durable Object, the app's files served from the GitHub repo.
name = "rudy-aya-ledger"
main = "src/worker.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LedgerStore"]

[vars]
# First run on an empty store copies everything from here (same household key). Remove once the move is done.
IMPORT_FROM = "https://rudy-aya-ledger.netlify.app"
# Where the app files come from (public/ in this repo, as described by dist/assets.json)
ASSET_REPO = "rudysaliby/rudy-aya-ledger"
ASSET_BRANCH = "main"

[observability]
enabled = true
